<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Social look C: Type in Motion</title>
<!-- Look C, "Type in Motion": bold kinetic typography over the full-bleed real photo, for a 9:16 phone video. Scene 1: the
     title in big masked lines over a navy scrim, its last word in the accent. Scene 2: the photo clears, a line is drawn
     through the centre of the screen (figure "height") and the body rises under the TV. Scene 3: the fact as one giant number
     counting up, then the photo shows inside it. Scene 4: a brand-blue field and the end card (the mark assembles, site, area).
     Every word, number, URL and mark stays inside the R-2-08 safe zone (social/lib/brief.mjs SAFE): the TV sits high in the
     frame (the photo may run under the top band), the type in the lower half of the safe box. Every style is a pure function
     of t. Photos only, never AI images. -->
<link rel="stylesheet" href="/social/lib/stage.css">
<style>
#stage { background: var(--navy); color: var(--ink); font-family: var(--text); }
#pz { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#bg { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; overflow: hidden; }
#bg img { position: absolute; filter: blur(34px) saturate(1.1) brightness(.62); }
#win { position: absolute; left: 0; width: 1080px; overflow: hidden; }
#scrim, #dim { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
#eyebrow { position: absolute; font: 700 30px/1.1 var(--text); letter-spacing: .17em; text-transform: uppercase; white-space: nowrap; }
#title { position: absolute; font: 800 196px/.9 var(--display); letter-spacing: -.045em; text-wrap: balance; }
#title .acc { color: transparent; -webkit-background-clip: text; background-clip: text; background-size: 320% 100%; background-repeat: no-repeat; }
#eyeline { position: absolute; left: 0; width: 1080px; height: 6px; margin-top: -3px; transform-origin: 0 50%; }
#ctr { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 0 0 3px rgba(0,0,0,.15), 0 10px 30px rgba(0,0,0,.35); }
#ctr i { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #fff; }
#body { position: absolute; font: 700 76px/1.08 var(--display); letter-spacing: -.03em; text-wrap: pretty; }
#numwrap { position: absolute; left: 0; width: 1080px; top: 0; height: 1920px; }
.num { position: absolute; font: 800 520px/1 var(--display); letter-spacing: -.055em; white-space: nowrap; }
.num .u { color: var(--bluePale); }
#numbar { position: absolute; height: 14px; border-radius: 7px; transform-origin: 0 50%; }
#lab { position: absolute; font: 600 50px/1.15 var(--text); letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
#field { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#end { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
#emark { position: absolute; left: 430px; top: 500px; width: 220px; height: 220px; opacity: 0; }
#emark svg { overflow: visible; filter: drop-shadow(0 22px 34px rgba(5,20,60,.45)); }
#esite { position: absolute; left: 0; width: 1080px; top: 768px; text-align: center; font: 800 88px/1.05 var(--display); letter-spacing: -.04em; color: #fff; }
#erule { position: absolute; left: 504px; top: 900px; width: 72px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.85); }
#earea { position: absolute; left: 0; width: 1080px; top: 934px; text-align: center; font: 500 44px/1.2 var(--text); letter-spacing: .02em; color: rgba(255,255,255,.86); }
</style></head><body>
<div id="stage">
  <div id="pz"><div id="bg"><img id="bgph" alt=""></div><div id="win"><img id="ph" alt=""></div></div>
  <div id="scrim"></div><div id="dim"></div>
  <div id="eyeline"></div><div id="ctr"><i></i></div>
  <div id="eyebrow"></div>
  <div id="title"></div>
  <div id="body"></div>
  <div id="numwrap"><div class="num tnum" id="numW"></div><i id="numbar"></i><div id="lab"></div></div>
  <div id="field"></div>
  <div id="end"><div id="emark" data-safe="mark"></div><div id="esite"></div><i id="erule"></i><div id="earea"></div></div>
</div>
<script type="module">
import { seg, lerp, ease, clamp, rise } from '/ads/lib/motion.js';
import { boot, SAFE, markSVG, markBuilder, framePhoto, placeImg, maskWords, maskLines, fitFont, textBottom } from '/social/lib/stage.js';
import { parseFact, factAt } from '/social/lib/brief.mjs';
const $ = (s) => document.querySelector(s);
try {
  const S = await boot($('#stage'));
  const { card, brand, photo, tpl } = S, C = brand.colors;
  const DUR = +(S.brief.duration || tpl.duration);
  const rgba = (hex, a) => { const h = hex.replace('#', ''); return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`; };
  const N = (a) => rgba(C.navy, a);

  // ---------- the photo fills the frame, its TV in the upper part (the words live below it). A tall photo (1:1.6 or taller)
  // is simply cropped. Anything wider, cropped to 9:16, turns the TV into a black slab filling the frame (the smartmount card
  // press found the same), so it sits as a sharp, feathered window across the full width over a blurred copy of itself.
  const img = $('#ph'); img.src = photo.url; $('#bgph').src = photo.url;
  const portrait = photo.h / photo.w >= 1.6, TVY = 380, COLW = SAFE.x1 - SAFE.x0;   // the TV high (below the tab row), the type below it
  let F;
  if (portrait) {
    $('#win').style.top = '0px'; $('#win').style.height = '1920px'; $('#bg').style.display = 'none';
    F = framePhoto(photo, 1080, 1920, { ay: TVY / 1920, cap: 1.25 }); placeImg(img, F);
  } else {
    // the TV keeps its own place in the photo (no extra zoom); the window moves so the TV lands at TVY
    const winH = Math.round(1080 * 1.16 * photo.h / photo.w), f0 = framePhoto(photo, 1080, winH, { ay: (photo.tv[1] + photo.tv[3]) / 2, cap: 1.0 });
    const top = Math.round(TVY - f0.tv.cy); $('#win').style.top = top + 'px'; $('#win').style.height = winH + 'px';
    $('#win').style.webkitMaskImage = $('#win').style.maskImage = 'linear-gradient(to bottom, transparent 0%, #000 9%, #000 84%, transparent 100%)';
    placeImg(img, f0);
    const fb = framePhoto(photo, 1200, 2040, { ay: (TVY + 60) / 2040, cap: 1.2 }); placeImg($('#bgph'), fb);
    F = { ...f0, tv: { ...f0.tv, y0: f0.tv.y0 + top, y1: f0.tv.y1 + top, cy: f0.tv.cy + top } };
  }
  $('#pz').style.transformOrigin = `${F.tv.cx}px ${F.tv.cy}px`;

  // ---------- words (only from the brief and the brand)
  const eyebrow = $('#eyebrow'), title = $('#title'), body = $('#body');
  eyebrow.textContent = card.eyebrow || ''; eyebrow.style.color = C.bluePale;
  title.textContent = card.title; body.textContent = card.body || '';
  $('#esite').textContent = brand.site; $('#earea').textContent = brand.area; $('#emark').innerHTML = markSVG(S.logo);
  const fact = card.fact ? parseFact(card.fact[0]) : null;
  const escH = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // the number in white, its unit (the inch mark, "min", "ft") in the accent
  const numHTML = (txt) => { if (!fact || !fact.count || !fact.suffix) return escH(txt); const n = txt.slice(0, txt.length - fact.suffix.length); return escH(n) + `<span class="u">${escH(fact.suffix)}</span>`; };
  if (fact) { $('#numW').innerHTML = numHTML(fact.text); $('#lab').textContent = card.fact[1]; }

  // ---------- fit: the title in at most three big lines in the lower part of the safe box (the column is the box's width)
  for (const el of [eyebrow, title, body, $('#numW'), $('#numbar'), $('#lab')]) el.style.left = SAFE.x0 + 'px';
  eyebrow.style.left = (SAFE.x0 + 4) + 'px'; $('#numbar').style.left = $('#lab').style.left = (SAFE.x0 + 8) + 'px';
  title.style.width = body.style.width = COLW + 'px';
  const TVB = Math.round(F.tv.y1 + 0.06 * (F.tv.y1 - F.tv.cy));   // the TV's bottom edge at the end of the push-in
  const TITLE_TOP = Math.max(TVB + 150, 620), TITLE_MAX = SAFE.y1 - 24 - TITLE_TOP;   // eyebrow and title clear of the TV
  fitFont(eyebrow, 20, 30, () => eyebrow.scrollWidth <= COLW - 8, 'eyebrow');
  fitFont(title, 96, 200, () => title.scrollWidth <= COLW && title.offsetHeight <= Math.min(TITLE_MAX, parseFloat(title.style.fontSize) * 0.9 * 3 + 4), 'title');
  const tL = maskLines(title);
  const titleTop = Math.round(SAFE.y1 - 18 - textBottom(title)); title.style.top = titleTop + 'px'; eyebrow.style.top = (titleTop - 60) + 'px';
  const lastLine = tL[tL.length - 1]; const lw = lastLine.textContent.split(' '); const lastWord = lw.pop();
  lastLine.innerHTML = (lw.length ? escH(lw.join(' ')) + ' ' : '') + `<span class="acc">${escH(lastWord)}</span>`;
  const acc = lastLine.querySelector('.acc');
  acc.style.backgroundImage = `linear-gradient(100deg, ${C.bluePale} 0%, ${C.bluePale} 42%, #ffffff 50%, ${C.bluePale} 58%, ${C.bluePale} 100%)`;
  // body: low in the safe box, on the dark part of the scrim, clear of the TV and its line
  const BODY_MIN = Math.max(TVB + 150, 860);
  if (card.body) fitFont(body, 50, 80, () => body.scrollWidth <= COLW && body.offsetHeight <= SAFE.y1 - 24 - BODY_MIN, 'body');
  body.style.top = Math.round(SAFE.y1 - 18 - textBottom(body)) + 'px';   // 18 px: a rising line's mask reaches a little below its resting glyphs
  const bL = card.body ? maskLines(body) : [];
  // the giant number, as wide as the safe box allows
  const numW = $('#numW');
  if (fact) {
    fitFont(numW, 180, 560, () => numW.scrollWidth <= COLW && numW.offsetHeight <= 520, 'fact number');
    numW.style.minWidth = numW.offsetWidth + 'px';
    const nh = numW.offsetHeight, ntop = Math.round(SAFE.y0 + (SAFE.y1 - SAFE.y0) * 0.42 - nh / 2);
    numW.style.top = ntop + 'px';
    $('#numbar').style.top = (ntop + nh + 18) + 'px'; $('#numbar').style.width = Math.min(COLW - 8, numW.offsetWidth - 20) + 'px'; $('#numbar').style.background = C.blue;
    $('#lab').style.top = (ntop + nh + 60) + 'px';
    fitFont($('#lab'), 32, 50, () => $('#lab').scrollWidth <= COLW - 8, 'fact words');
  }
  // the end card: the site as large as the safe zone allows around the frame's centre line
  fitFont($('#esite'), 56, 88, () => { const e = $('#esite'), r = document.createRange(); r.selectNodeContents(e); return r.getBoundingClientRect().width / (e.getBoundingClientRect().width / 1080) <= 2 * (SAFE.x1 - 540) - 24; }, 'end card site');
  const labW = maskWords($('#lab'));
  $('#eyeline').style.top = F.tv.cy + 'px'; $('#eyeline').style.background = `linear-gradient(90deg, ${rgba(C.bluePale, 0)} 0%, ${C.bluePale} 18%, ${C.bluePale} 82%, ${rgba(C.bluePale, 0)} 100%)`;
  $('#ctr').style.left = F.tv.cx + 'px'; $('#ctr').style.top = F.tv.cy + 'px';
  $('#field').style.background = `linear-gradient(160deg, ${C.blue} 0%, ${C.blueDeep} 100%)`;
  const siteW = maskWords($('#esite')), areaW = maskWords($('#earea')), mark = markBuilder($('#emark'), brand.mark_build);
  const FIG = S.brief.figure === 'height';

  // ---------- timeline (seconds)
  const T = { eye: -0.1, title: -0.04, shine: 1.55, out1: 2.75, line: 3.05, body: 3.3, out2: 5.95, dark: 5.9, num: 6.42, cnt: 1.2, lab: 7.15, out3: 9.45, field: 9.55, mark: 10.0 };
  // the scrim, from this photo's own geometry: [y px, scene 1 strength, scene 2 strength]. Clear over the TV; it darkens
  // just under the TV's bottom edge so the eyebrow and the title (scene 1) and the body (scene 2) always sit on navy.
  const eyeTop = parseFloat(eyebrow.style.top), bodyTop = parseFloat(body.style.top) || 1100;
  const yA = TVB + 16, y1 = Math.max(yA + 50, eyeTop - 14), y2 = Math.max(yA + 90, bodyTop - 70);
  const SCRIM = [[0, 0.18, 0.08], [307, 0, 0], [yA, 0.03, 0.02], [y1, 0.74, 0.3], [y1 + 120, 0.88, 0.45], [Math.max(y2, y1 + 121), 0.88, 0.62], [y2 + 70, 0.9, 0.84], [1920, 0.92, 0.92]].sort((a, b) => a[0] - b[0]);
  const SOFT = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);

  window.KF = { duration: DUR, fps: 30, cover: tpl.cover, async render(i, t) {
    // photo: one long push towards the TV through scenes 1 and 2, then it settles behind the number
    const push = SOFT(seg(t, 0, T.out2 + 0.5));
    $('#pz').style.transform = `scale(${1.0 + 0.10 * push})`;
    // scrim: strong at the bottom for the title, eases for the body, the frame darkens for the number
    const s1 = 1 - ease.inOutCubic(seg(t, T.out1, T.out1 + 0.6));
    $('#scrim').style.background = `linear-gradient(to bottom, ${SCRIM.map(([y, a1, a2]) => `${N(lerp(a2, a1, s1))} ${y}px`).join(', ')})`;
    $('#dim').style.background = C.navy; $('#dim').style.opacity = (0.82 * ease.inOutCubic(seg(t, T.dark, T.dark + 0.5))).toFixed(3);
    // scene 1: eyebrow wipes on, title lines rise; one light sweep across the accent word
    const ep = ease.outExpo(seg(t, T.eye, T.eye + 0.8)), eo = ease.inCubic(seg(t, T.out1, T.out1 + 0.3));
    eyebrow.style.clipPath = `inset(0 ${(1 - ep) * 100}% 0 0)`; eyebrow.style.opacity = 1 - eo; eyebrow.style.transform = `translateY(${-eo * 30}px)`;
    rise(tL, t, T.title, { stagger: 0.09, dur: 0.85, tOut: T.out1, outDur: 0.34 });
    acc.style.backgroundPosition = `${lerp(100, 0, ease.inOutCubic(seg(t, T.shine, T.shine + 0.9)))}% 0`;
    // scene 2: the line through the centre of the screen, the ring on it, the body under the TV
    const lnp = ease.inOutCubic(seg(t, T.line, T.line + 0.6)), lno = ease.inCubic(seg(t, T.out2, T.out2 + 0.3));
    $('#eyeline').style.transform = `scaleX(${FIG ? lnp : 0})`; $('#eyeline').style.opacity = 1 - lno;
    const cp = ease.outBack(seg(t, T.line + 0.4, T.line + 0.75), 2.2);
    $('#ctr').style.opacity = FIG ? clamp(cp * 3) * (1 - lno) : 0; $('#ctr').style.transform = `scale(${Math.max(0, cp) * (1 + 0.06 * Math.sin(Math.max(0, t - T.line - 0.75) * 4))})`;
    rise(bL, t, T.body, { stagger: 0.12, dur: 0.85, tOut: T.out2, outDur: 0.32 });
    // scene 3: the giant number counts up, its unit in the accent; the bar runs with the count; its words
    if (fact) {
      const np = seg(t, T.num, T.num + T.cnt), no = ease.inCubic(seg(t, T.out3, T.out3 + 0.35));
      numW.innerHTML = numHTML(factAt(fact, ease.outCubic(np)));
      const nin = ease.outExpo(seg(t, T.num - 0.1, T.num + 0.6));
      // in from below, out downwards while it fades (a tall number leaving upwards would touch the top band)
      numW.style.transform = `translateY(${(1 - nin) * 120 + no * 70}px) scale(${(0.94 + 0.06 * nin) * (1 - 0.04 * no)})`; numW.style.transformOrigin = '0 100%';
      numW.style.opacity = clamp(nin * 1.4) * (1 - no);
      $('#numbar').style.transform = `scaleX(${ease.outExpo(seg(t, T.num + 0.2, T.num + T.cnt)) * (1 - no)})`;
      rise(labW, t, T.lab, { stagger: 0.05, dur: 0.8, tOut: T.out3, outDur: 0.3 });
    }
    // scene 4: the brand-blue field rises, the mark assembles, the site and the area rise
    const fp = ease.inOutCubic(seg(t, T.field, T.field + 0.55));
    $('#field').style.clipPath = `inset(${(1 - fp) * 100}% 0 0 0)`;
    mark(seg(t, T.mark, T.mark + 1.1));
    rise(siteW, t, T.mark + 0.45, { stagger: 0.05, dur: 0.85 }); rise(areaW, t, T.mark + 0.68, { dur: 0.85 });
    $('#erule').style.transform = `scaleX(${ease.outExpo(seg(t, T.mark + 0.9, T.mark + 1.6))})`;
  } };
  window.KF_READY = true;
} catch (e) { window.KF_ERROR = String(e && e.message || e); console.error('template error:', window.KF_ERROR); }
</script></body></html>
