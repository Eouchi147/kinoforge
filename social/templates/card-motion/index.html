<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Social look A: Card in motion</title>
<!-- Look A, "Card in motion": the client's own social card (Smart Mount tools/cards.js: photo band bleeding into a flat navy
     panel, blue eyebrow, white title, the fact set as a figure) brought to life for a 9:16 phone video. The photo pushes in
     slowly; eyebrow, title, body and fact rise in; the fact counts up; the panel rises over the photo into the end card
     (mark, site, area). Words stay inside the phone safe zone (social/lib/brief.mjs SAFE). Every style is a pure function of t.
     Brief: ?brief=<batch.json>&id=<video> or ./sample.json. Words come only from the brief and brand.json, never invented. -->
<link rel="stylesheet" href="/social/lib/stage.css">
<style>
#stage { background: var(--navy); color: var(--ink); font-family: var(--text); }
#flag { position: absolute; left: 0; top: 0; width: 1080px; height: 12px; background: var(--blue); transform-origin: 0 50%; z-index: 8; }
#band { position: absolute; left: 0; top: 0; width: 1080px; height: 1000px; overflow: hidden; }
#zoom { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#wash { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--navy); opacity: .06; }
#eyeline { position: absolute; left: 0; width: 1080px; height: 5px; margin-top: -2.5px; transform-origin: 0 50%; opacity: 0; }
#ctr { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.35); opacity: 0; }
#ctr i { position: absolute; left: 50%; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: #fff; }
#panel { position: absolute; left: 0; width: 1080px; background: var(--navy); }
#fade { position: absolute; left: 0; width: 1080px; bottom: 100%; height: 360px; pointer-events: none; }
/* the card's footer (hairline, mark, address, locality), at the bottom of the phone safe zone */
#foot { position: absolute; left: 72px; width: 878px; height: 76px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
#foot .rule { position: absolute; left: 0; right: 0; top: -14px; height: 1px; transform-origin: 0 50%; }
#foot .who { display: flex; align-items: center; gap: 16px; font: 700 31px/1 var(--text); letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
#foot .mk { width: 58px; height: 58px; flex: none; }
#foot .where { font: 500 27px/1 var(--text); color: var(--ink3); white-space: nowrap; }
#copy { position: absolute; left: 72px; width: 878px; z-index: 4; }
#eyebrow { font: 700 30px/1.1 var(--text); letter-spacing: .17em; text-transform: uppercase; color: var(--blue); white-space: nowrap; }
#title { margin: 26px 0 0; font: 800 100px/1.0 var(--display); letter-spacing: -.032em; color: var(--ink); text-wrap: balance; }
#body { margin: 30px 0 0; font: 400 42px/1.38 var(--text); color: var(--ink2); max-width: 760px; text-wrap: balance; }
#fact { margin: 38px 0 0; position: relative; display: flex; align-items: baseline; gap: 22px; padding-left: 30px; }
#fact .bar { position: absolute; left: 0; top: 4px; bottom: 2px; width: 8px; background: var(--blue); transform-origin: 50% 100%; }
#fact .num { font: 800 96px/1 var(--display); letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
#fact .lab { font: 500 36px/1.2 var(--text); color: var(--ink2); white-space: nowrap; }
#end { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 6; pointer-events: none; }
#eglow { position: absolute; left: 540px; top: 690px; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%; }
#emark { position: absolute; left: 410px; top: 540px; width: 260px; height: 260px; opacity: 0; }
#emark svg { overflow: visible; filter: drop-shadow(0 22px 34px rgba(0,0,0,.55)); }
#esite { position: absolute; left: 0; width: 1080px; top: 858px; text-align: center; font: 800 100px/1.05 var(--display); letter-spacing: -.035em; color: var(--ink); }
#erule { position: absolute; left: 500px; top: 1000px; width: 80px; height: 6px; border-radius: 3px; background: var(--blue); transform-origin: 50% 50%; }
#earea { position: absolute; left: 0; width: 1080px; top: 1038px; text-align: center; font: 500 46px/1.2 var(--text); letter-spacing: .02em; color: var(--ink2); }
</style></head><body>
<div id="stage">
  <div id="band"><div id="zoom"><img id="ph" alt=""><div id="eyeline"></div><div id="ctr"><i></i></div></div><div id="wash"></div></div>
  <div id="panel"><div id="fade"></div></div>
  <div id="foot"><i class="rule"></i><span class="who"><span class="mk" id="footmark"></span><span id="footsite"></span></span><span class="where" id="footarea"></span></div>
  <div id="copy">
    <div id="eyebrow"></div>
    <h1 id="title"></h1>
    <div id="body"></div>
    <div id="fact"><i class="bar"></i><span class="num tnum" id="num"></span><span class="lab" id="lab"></span></div>
  </div>
  <div id="end"><div id="eglow"></div><div id="emark"></div><div id="esite"></div><i id="erule"></i><div id="earea"></div></div>
  <div id="flag"></div>
</div>
<script type="module">
import { seg, lerp, ease, clamp, rise } from '/ads/lib/motion.js';
import { boot, SAFE, markSVG, markBuilder, framePhoto, placeImg, maskWords, maskLines, fitFont } from '/social/lib/stage.js';
import { parseFact, factAt } from '/social/lib/brief.mjs';
const $ = (s) => document.querySelector(s);
try {
  const S = await boot($('#stage'));
  const { card, brand, photo, tpl } = S;
  const DUR = +(S.brief.duration || tpl.duration);
  const rgba = (hex, a) => { const h = hex.replace('#', ''); return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`; };
  const NAVY = brand.colors.navy;

  // ---------- words (only from the brief and the brand)
  $('#eyebrow').textContent = card.eyebrow || '';
  $('#title').textContent = card.title;
  $('#body').textContent = card.body || '';
  const fact = card.fact ? parseFact(card.fact[0]) : null;
  if (fact) { $('#num').textContent = fact.text; $('#lab').textContent = card.fact[1]; } else $('#fact').style.display = 'none';
  if (!card.body) $('#body').style.display = 'none';
  $('#footsite').textContent = brand.site; $('#footarea').textContent = brand.area; $('#esite').textContent = brand.site; $('#earea').textContent = brand.area;
  $('#footmark').innerHTML = markSVG(S.logo); $('#emark').innerHTML = markSVG(S.logo);
  $('#foot .rule').style.background = rgba(brand.colors.ink2, 0.22);
  const FOOT = SAFE.y1 - 76; $('#foot').style.top = FOOT + 'px';
  $('#fade').style.background = `linear-gradient(to bottom, ${rgba(NAVY, 0)} 0%, ${rgba(NAVY, 0.55)} 42%, ${NAVY} 100%)`;

  // ---------- fit: the title in two lines at most, then the band gives way before the type does (as the card press does)
  const title = $('#title'), copy = $('#copy'), body = $('#body');
  fitFont($('#eyebrow'), 22, 30, () => $('#eyebrow').scrollWidth <= 878, 'eyebrow');
  fitFont(title, 76, 100, () => title.offsetHeight <= parseFloat(title.style.fontSize) * 2.05 && title.scrollWidth <= 878, 'title');
  let BAND = 1000; const LIMIT = FOOT - 44;   // the copy ends above the footer's hairline
  const layout = (band) => { copy.style.top = (band + 34) + 'px'; return band + 34 + copy.offsetHeight; };
  while (layout(BAND) > LIMIT && BAND > 820) BAND -= 10;
  if (layout(BAND) > LIMIT) {   // still long: the body and the title shrink a little (at most 12%)
    const tb = parseFloat(title.style.fontSize), bb = 42;
    for (let k = 1; k <= 6 && layout(BAND) > LIMIT; k++) { title.style.fontSize = tb * (1 - 0.02 * k) + 'px'; body.style.fontSize = bb * (1 - 0.02 * k) + 'px'; }
  }
  if (layout(BAND) > LIMIT) throw new Error('copy too long for the 9:16 card: shorten the words rather than shrinking the type');
  $('#band').style.height = BAND + 'px'; $('#fade').style.height = Math.round(BAND * 0.36) + 'px';   // the card's fade, riding on the panel's top edge

  // ---------- the photo, framed so the TV sits in the clear part of the band (below the platform tabs, above the fade)
  const img = $('#ph'); img.src = photo.url;
  const F = framePhoto(photo, 1080, BAND, { ay: (SAFE.y0 + 0.62 * BAND) / 2 / BAND, cap: 1.33 });
  placeImg(img, F);
  $('#zoom').style.transformOrigin = `${F.tv.cx}px ${F.tv.cy}px`;
  // figure "height": a line through the centre of the screen in the photo (the body's words, shown), moving with the photo
  const FIG = S.brief.figure === 'height';
  $('#eyeline').style.top = F.tv.cy + 'px'; $('#ctr').style.left = F.tv.cx + 'px'; $('#ctr').style.top = F.tv.cy + 'px';
  $('#eyeline').style.background = `linear-gradient(90deg, ${rgba(brand.colors.bluePale, 0)} 0%, ${brand.colors.bluePale} 16%, ${brand.colors.bluePale} 84%, ${rgba(brand.colors.bluePale, 0)} 100%)`;

  // ---------- masked words and lines
  const tW = maskWords(title), bL = card.body ? maskLines(body) : [], eyebrow = $('#eyebrow');
  const numEl = $('#num'); numEl.style.minWidth = numEl.offsetWidth + 'px';
  const siteW = maskWords($('#esite')), areaW = maskWords($('#earea'));

  // ---------- timeline (seconds). One calm idea at a time; nothing idles without the photo moving.
  // the title is up by half a second (the hook); all the words are in by about 3.8 s; a beat on the photo; time to read; the end card.
  const T = { flag: 0.0, foot: 0.45, eye: -0.12, title: -0.06, body: 1.35, bar: 2.5, count: 2.6, lab: 3.0, line: 4.1, out: 7.5, rise: 7.65, risen: 8.45, mark: 8.2, site: 8.62, area: 8.85 };
  const mark = markBuilder($('#emark'), brand.mark_build);
  $('#eglow').style.background = `radial-gradient(closest-side, ${rgba(brand.colors.blue, 0.22)}, ${rgba(brand.colors.blue, 0.07)} 55%, ${rgba(brand.colors.blue, 0)})`;
  const COUNT = 1.15, SOFT = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);

  window.KF = { duration: DUR, fps: 30, cover: tpl.cover, async render(i, t) {
    // flag: the brand rule draws across the top
    $('#flag').style.transform = `scaleX(${ease.outExpo(seg(t, T.flag, T.flag + 0.6))})`;
    // photo: one slow push towards the TV for the whole card, a touch of drift
    const push = SOFT(seg(t, 0, T.risen));
    $('#zoom').style.transform = `translateY(${-14 * push}px) scale(${1 + 0.15 * push})`;
    if (FIG) {   // the line is drawn through the centre of the screen, a ring lands on it
      const lp = ease.inOutCubic(seg(t, T.line, T.line + 0.6)), lo = ease.inCubic(seg(t, T.out, T.out + 0.3)), cp = ease.outBack(seg(t, T.line + 0.4, T.line + 0.75), 2.2);
      $('#eyeline').style.opacity = 1 - lo; $('#eyeline').style.transform = `scaleX(${lp})`;
      $('#ctr').style.opacity = clamp(cp * 3) * (1 - lo); $('#ctr').style.transform = `scale(${Math.max(0, cp)})`;
    }
    // the panel: holds the words, then rises over the photo into the end card
    const up = ease.inOutCubic(seg(t, T.rise, T.risen)), ptop = lerp(BAND, 0, up);
    $('#panel').style.top = ptop + 'px'; $('#panel').style.height = (1920 - ptop) + 'px';
    $('#band').style.visibility = up >= 1 ? 'hidden' : 'visible';
    // the card's footer: the hairline draws, the mark and the address come up (most viewers never reach an end card)
    const fp = ease.outExpo(seg(t, T.foot, T.foot + 0.8)), fOut0 = ease.inCubic(seg(t, T.out + 0.12, T.out + 0.42));
    $('#foot .rule').style.transform = `scaleX(${fp})`;
    $('#foot').style.opacity = clamp(fp * 1.4) * (1 - fOut0); $('#foot').style.transform = `translateY(${(1 - fp) * 18 - fOut0 * 40}px)`;
    // eyebrow: wipes on from the left
    const ep = ease.outExpo(seg(t, T.eye, T.eye + 0.75)), eOut = ease.inCubic(seg(t, T.out, T.out + 0.3));
    eyebrow.style.clipPath = `inset(0 ${(1 - ep) * 100}% 0 0)`; eyebrow.style.transform = `translateY(${-eOut * 40}px)`; eyebrow.style.opacity = 1 - eOut;
    // title words, body lines: rise out of their masks, leave upwards when the card closes
    rise(tW, t, T.title, { stagger: 0.07, dur: 0.8, tOut: T.out + 0.04, outDur: 0.32 });
    rise(bL, t, T.body, { stagger: 0.12, dur: 0.8, tOut: T.out + 0.08, outDur: 0.32 });
    // fact: the bar grows, the number counts up, the words follow
    if (fact) {
      const bp = ease.outExpo(seg(t, T.bar, T.bar + 0.5)), fOut = ease.inCubic(seg(t, T.out + 0.1, T.out + 0.42));
      $('#fact .bar').style.transform = `scaleY(${bp * (1 - fOut)})`;
      const np = seg(t, T.count, T.count + COUNT);
      numEl.textContent = factAt(fact, ease.outCubic(np));
      numEl.style.opacity = clamp(np * 5) * (1 - fOut); numEl.style.transform = `translateY(${(1 - ease.outExpo(clamp(np * 1.6))) * 30 - fOut * 50}px)`;
      const lp = ease.outExpo(seg(t, T.lab, T.lab + 0.7));
      $('#lab').style.opacity = lp * (1 - fOut); $('#lab').style.transform = `translateX(${(1 - lp) * -18}px) translateY(${-fOut * 50}px)`;
    }
    // end card: the mark lands with a soft spring, the site and the area rise, a short blue rule
    mark(seg(t, T.mark, T.mark + 1.05));   // the mark assembles: ground, wall plate and arm, the screen hooks on
    const gp = seg(t, T.mark - 0.1, T.mark + 1.6);
    $('#eglow').style.opacity = ease.outCubic(gp); $('#eglow').style.transform = `scale(${0.6 + 0.4 * ease.outCubic(gp) + 0.03 * Math.sin(Math.max(0, t - T.mark) * 1.6)})`;
    rise(siteW, t, T.site, { stagger: 0.05, dur: 0.85 }); rise(areaW, t, T.area, { dur: 0.85 });
    $('#erule').style.transform = `scaleX(${ease.outExpo(seg(t, T.area + 0.25, T.area + 0.95))})`;
  } };
  window.KF_READY = true;
} catch (e) { window.KF_ERROR = String(e && e.message || e); console.error('template error:', window.KF_ERROR); }
</script></body></html>
