# The house rules as gates (tools/verify.py), on every push and pull request. Cheap: no rendering, no paid call,
# no extra packages (about 1 minute). The heavier engine gates (Chromium, director checks, score) are in verify-engine.yml.
# Red here means a rule was broken: read the "how to fix" line under each FAIL, fix it, push again.
name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: gates
        env:
          # the docs gate judges the commits of this push (or of the pull request)
          VERIFY_SINCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/verify.sh --only secrets,json,syntax,workflows,text,prompts,battlemap,social,docs
