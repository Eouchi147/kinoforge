# Ads built in code (harness/shots/codead.py): the scene is rendered frame by frame in headless Chromium (no AI fees),
# then voiced (ElevenLabs via OpenRouter), scored (Lyria via OpenRouter) and mixed. Dispatch with the ad id (ads/<id>/ad.json).
# The finished ad goes to the "ads" release; the cost record (ads/<id>/ledger.json) is committed.
name: codead
on:
  workflow_dispatch:
    inputs:
      ad: { description: 'ad id under ads/', required: true }
permissions:
  contents: write
concurrency: { group: 'codead-${{ inputs.ad }}', cancel-in-progress: false }
jobs:
  ad:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { A: '${{ inputs.ad }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: harness/package-lock.json }
      - run: npm ci --prefix harness --no-audit --no-fund
      - run: cd harness && npx playwright install --with-deps chromium > /dev/null
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q numpy pillow
      - name: build the ad
        env: { OPENROUTER_API_KEY: '${{ secrets.OPENROUTER_API_KEY }}' }
        run: set -o pipefail; python harness/shots/codead.py ads/$A 2>&1 | tee ads/$A/codead.log
      - name: publish
        if: always()
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          gh release view ads > /dev/null 2>&1 || gh release create ads --title "ads" --notes "Finished ads built in code (picture rendered in Chromium, voice and score via OpenRouter)." || true
          for f in ads/$A/out/$A.mp4 ads/$A/out/$A-sheet.jpg ads/$A/codead.log; do [ -f "$f" ] && gh release upload ads "$f" --clobber || true; done
          git config user.name "kinoforge-bot"; git config user.email "bot@users.noreply.github.com"
          [ -f ads/$A/ledger.json ] && git add ads/$A/ledger.json
          git commit -qm "ad $A: ledger" && (git pull -q --rebase && git push -q) || true

