<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Unmissed v1: Manifesto</title>
<!-- Unmissed brand ad, version 1 "Manifesto": kinetic typography cut to the score (see TREATMENT.md and ads/UNMISSED_DIRECTION.md).
     Built in code, no AI fees. Every time comes from ./ad.json (cues, duration, beat grid), so picture and sound share one timeline.
     Ad time = music time minus audio.music_offset. Beat n (counted from the drop) is at drop + n * grid.beat_s.
     Cuts and hits are snapped to whole frames (30 fps) so no frame is a half-blended mix of two shots. -->
<style>

html, body { margin:0; background:#000; overflow:hidden; }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family:Inst, sans-serif; color:var(--ink); }
#cam { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:960px 540px; will-change:transform; }
.shot { position:absolute; left:0; top:0; width:1920px; height:1080px; visibility:hidden; will-change:transform; }
.field { position:absolute; left:-200px; top:-200px; width:2320px; height:1480px; }
.night { background-color:var(--bg); background-image:radial-gradient(60% 70% at 52% 50%, var(--glow) 0%, var(--glow2) 52%, var(--bg) 100%); }
.ink { background:var(--bg); } .blue { background:var(--blue); } .white { background:#fff; }
/* masked headline: each line rises out of its own mask; the block scale-punches */
.hl { position:absolute; left:0; top:0; white-space:nowrap; font-weight:700; font-stretch:75%; letter-spacing:-.04em; word-spacing:.09em; line-height:.9; font-size:100px; will-change:transform; }
.hl.c { text-align:center; } .hl.r { text-align:right; }
.hl.mono { font-family:Mono, monospace; font-weight:500; font-stretch:100%; letter-spacing:-.03em; }
.hl.wide { font-stretch:88%; font-weight:600; letter-spacing:-.035em; }
.ln { display:block; overflow:hidden; padding:.14em .07em .24em; margin:-.14em -.07em -.24em; }
.in { display:block; will-change:transform; }
.gl { position:absolute; left:0; top:0; will-change:transform; }
.gl svg { display:block; overflow:visible; }
.abs { position:absolute; left:0; top:0; will-change:transform; }
.lab { position:absolute; left:0; top:0; font:500 34px/1 Mono, monospace; letter-spacing:-.01em; white-space:nowrap; }
.full { position:absolute; left:0; top:0; width:1920px; height:1080px; }
#flash { position:absolute; left:0; top:0; width:1920px; height:1080px; background:#fff; opacity:0; pointer-events:none; }
.tag { position:absolute; left:0; width:1920px; text-align:center; font-weight:500; font-stretch:100%; letter-spacing:-.022em; white-space:nowrap; line-height:1; }
.caret { display:inline-block; width:0; height:.82em; border-left:.07em solid var(--accent); margin-right:-.07em; vertical-align:-.08em; }
#ailabel { position:absolute; left:0; width:1920px; text-align:center; top:980px; font:500 28px/1 Mono, monospace; color:var(--ink3); letter-spacing:.005em; }
</style></head><body>

const V1 = AD.audio.vo[1].start;   // the tagline types in with the voice: word times measured from audio/vo/line1.mp3 (file time + its start)
const TY1 = [[V1 + .09, 0], [V1 + .21, 2], [V1 + .36, 2], [V1 + .88, 10], [V1 + 1.02, 10], [V1 + 1.55, 19]], TY2 = [[V1 + 1.98, 0], [V1 + 2.14, 3], [V1 + 2.6, 6], [V1 + 2.72, 6], [V1 + 2.92, 12], [V1 + 3.0, 12], [V1 + 3.38, 17]];
const keyed = (t, K) => { if (t <= K[0][0]) return 0; for (let i = 1; i < K.length; i++) if (t <= K[i][0]) return lerp(K[i - 1][1], K[i][1], seg(t, K[i - 1][0], K[i][0])); return K[K.length - 1][1]; };
function typed(node, str, n, caretOn) {

R.s13 = (t) => {

function renderRing(t) {

  } else {

  const ip = seg(t, T.logo + 3 * F, T.logo + 3 * F + .5);
  rb.setAttribute('cx', cx + r * .5); rb.setAttribute('cy', cy - r * .866); rb.setAttribute('r', 20 + 260 * ease.outExpo(ip)); rb.setAttribute('stroke', '#79b4ff'); rb.setAttribute('stroke-width', 5 * (1 - ip) + .5); rb.style.opacity = ho && ip > 0 && ip < 1 ? String(.8 * (1 - ip)) : '0';
}

window.KF = { duration: DUR, fps: 30, async render(i, t) {
  const c = camera(t); camEl.style.transform = `translate3d(${c.x}px,${c.y}px,0) rotate(${c.r}deg) scale(${c.s})`;
  WINS.forEach(([id, a, b], k) => {
    const nx = WINS[k + 1] && PUSH[WINS[k + 1][0]], e = el[id];
    const hold = nx ? PUSH_DUR : (IRIS[WINS[k + 1] && WINS[k + 1][0]] || 0);
    const vis = t >= a - EPS && t < b + hold - EPS; show(e, vis); if (!vis) return;
    let dx = 0, dy = 0; const pe = PUSH[id];

    if (nx) { const p = ease.outExpo(seg(t, b, b + PUSH_DUR)); dx -= p * nx[0]; dy -= p * nx[1]; }
    e.style.transform = `translate3d(${dx}px,${dy}px,0)`;
    if (IRIS[id]) { const ip = seg(t, a, a + IRIS[id]); e.style.clipPath = ip >= 1 ? 'none' : `circle(${(ease.outExpo(ip) * 1500).toFixed(1)}px at 960px 540px)`; }
    R[id](t);

} };
